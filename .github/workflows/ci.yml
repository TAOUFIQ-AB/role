name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r dashboard/requirements.txt
          python -m pip check

      - name: Validate shell entrypoint syntax
        run: bash -n entrypoint.sh

      - name: Compile with warnings treated as errors
        run: python -W error -m compileall -q app dashboard .github/scripts tests

      - name: Validate dashboard import
        env:
          DATA_DIR: /tmp/reels-dashboard-ci
          DASHBOARD_PASSWORD: ci-password
          AGENT_TOKEN: ci-token
          SECRET_KEY: ci-secret
        run: python -c "import sys; sys.path.insert(0, 'dashboard'); import app; assert app.app.url_map"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
