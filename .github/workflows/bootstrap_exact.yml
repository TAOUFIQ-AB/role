name: Bootstrap exact project

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, verify, and install exact tested project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/archive-* > /tmp/role.zip.b64
          test "$(wc -c < /tmp/role.zip.b64)" -eq 151072
          base64 -d /tmp/role.zip.b64 > /tmp/role.zip
          echo "629150bb578f698384278f7d2f5770d1891181bfe11ef99a3f2412392b115c78  /tmp/role.zip" | sha256sum -c -
          rm -rf /tmp/role-unpack
          mkdir -p /tmp/role-unpack
          unzip -q /tmp/role.zip -d /tmp/role-unpack
          test -f /tmp/role-unpack/role-main/.github/workflows/ci.yml
          rsync -a --delete --exclude='.git/' /tmp/role-unpack/role-main/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install exact tested project"
          git push origin HEAD:main

      - name: Dispatch validation workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in ci.yml reels_agent.yml; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
                -d '{"ref":"main"}')"
              if [ "$code" = "204" ]; then ok=1; break; fi
              cat /tmp/dispatch.out || true
              sleep 2
            done
            test "$ok" -eq 1
          done
