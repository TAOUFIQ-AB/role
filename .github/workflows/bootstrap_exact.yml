name: Bootstrap exact project

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout bootstrap payload
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconstruct and verify exact project
        shell: bash
        run: |
          set -euo pipefail
          echo "Stored chunk SHA-256 values:"
          sha256sum .bootstrap/archive-{00..15}
          cat .bootstrap/archive-{00..15} > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.gz
          echo "ca4b069d6fd04dc4fb5f713cc1971a9c1db99fa9ac64e22adf640cbc419756cf  /tmp/project.tar.gz" | sha256sum -c -
          mkdir -p /tmp/project
          tar -xzf /tmp/project.tar.gz -C /tmp/project
          test -f /tmp/project/role-main/.github/workflows/ci.yml
          test -f /tmp/project/role-main/.github/workflows/reels_agent.yml

      - name: Install exact project dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/project/role-main
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check

      - name: Validate exact project
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/project/role-main
          bash -n entrypoint.sh
          python -W error -m compileall -q app .github/scripts tests
          python -m unittest discover -s tests -v

      - name: Publish verified project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/project/role-main/. .
          git add -A
          git commit -m "Publish verified GitHub Actions project"
          git push origin HEAD:main
