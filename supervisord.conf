; Optional supervisor launcher. entrypoint.sh is the recommended default.
; IMPORTANT: set XPRA_PASSWORD before starting supervisord. The HTML5/TCP
; endpoint is deliberately configured with env-based password authentication.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisor/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor/supervisor.sock

[program:xpra]
command=xpra start-desktop %(ENV_DISPLAY)s --bind-tcp=0.0.0.0:%(ENV_WEB_PORT)s,auth=env --html=on --start=fluxbox --daemon=no --pixel-depth=%(ENV_SCREEN_DEPTH)s --dpi=96 --desktop-scaling=off --opengl=no --mdns=no --notifications=no --bell=no --speaker=off --microphone=off --webcam=no --clipboard=no --file-transfer=no --printing=no
autostart=true
autorestart=false
priority=10
stdout_logfile=/var/log/reels-hunter/xpra.log
stderr_logfile=/var/log/reels-hunter/xpra.log
stdout_logfile_maxbytes=10MB
startsecs=5
stopasgroup=true
killasgroup=true

[program:agent]
command=python /app/agent.py
environment=DISPLAY="%(ENV_DISPLAY)s"
autostart=true
autorestart=false
priority=20
stdout_logfile=/var/log/reels-hunter/agent.log
stderr_logfile=/var/log/reels-hunter/agent_err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=20MB
startsecs=8
stopasgroup=true
killasgroup=true
